name: Refine hero headline branding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: "!contains(github.event.head_commit.message, 'Refine hero headline branding')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust hero headline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Replace the existing hero headline with a calmer three-color hierarchy.
          pattern=r'<h1[^>]*data-en="WINDSCREEN<br>SPECIALIST<br>NO\.1 IN KLANG"[^>]*>.*?</h1>'
          replacement='<h1 class="hero-headline" data-en="<span class=\'hero-red\'>WINDSCREEN</span><br><span class=\'hero-white\'>SPECIALIST</span><br><span class=\'hero-yellow\'>NO.1 IN KLANG</span>" data-ms="<span class=\'hero-red\'>PAKAR</span><br><span class=\'hero-white\'>WINDSCREEN</span><br><span class=\'hero-yellow\'>NO.1 DI KLANG</span>"><span class="hero-red">WINDSCREEN</span><br><span class="hero-white">SPECIALIST</span><br><span class="hero-yellow">NO.1 IN KLANG</span></h1>'
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n:
              s=s2
          css='''\n/* Hero headline: balanced Osaka red, white and yellow */\n.hero-headline .hero-red { color:#c9232d !important; }\n.hero-headline .hero-white { color:#fff !important; }\n.hero-headline .hero-yellow { color:#f4c400 !important; }\n.hero-headline { text-shadow:0 3px 18px rgba(0,0,0,.58); }\n'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/adjust-hero-branding.yml
          git add index.html .github/workflows/adjust-hero-branding.yml
          git commit -m "Refine hero headline branding" || exit 0
          git push