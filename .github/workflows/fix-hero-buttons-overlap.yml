name: Fix hero buttons overlap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix hero buttons overlap') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted hero button spacing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = '/* HERO BUTTONS OVERLAP FIX V2 */'
          if marker not in html:
              css = '''\n/* HERO BUTTONS OVERLAP FIX V2 */\n@media (min-width:901px){\n  .hero-left .buttons{\n    position:relative !important;\n    z-index:10 !important;\n    transform:translateY(-65px) !important;\n  }\n}\n@media (max-width:900px){\n  .hero-left .buttons{position:relative;z-index:6;}\n}\n'''
              html = html.replace('</style>', css + '</style>', 1)
              p.write_text(html, encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-hero-buttons-overlap.yml
          git commit -m "Fix hero buttons overlap"
          git push

# retrigger targeted fix
