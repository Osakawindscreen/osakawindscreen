name: Fix Why Us and Customer Gallery images
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[sections-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix section image paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'why-us-1.png': 'experience.jpg',
            'why-us-2.png': 'guarantee.jpg',
            'why-us-3.png': 'referral.jpg',
            'why-us-4.png': 'same-day.jpg',
            '<img src="windscreen-hero.png" alt="Windscreen installation">': '<img src="customer-1.jpg" alt="Windscreen installation">',
            '<img src="why-us-1.png" alt="Windscreen service">': '<img src="customer-2.jpg" alt="Windscreen service">',
            '<img src="why-us-4.png" alt="Vehicle service">': '<img src="customer-3.jpg" alt="Vehicle service">',
            'src="atome.png"': 'src="atome-logo.png"'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Why Us and Customer Gallery images [sections-fixed]"
          git push
