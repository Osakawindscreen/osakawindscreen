name: Update Insurance Panel Logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-insurance-logos:
    if: ${{ !startsWith(github.event.head_commit.message, 'Update insurance panel logos') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update insurance panel
        run: python scripts/update-insurance-logos.py

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update insurance panel logos"
          git push