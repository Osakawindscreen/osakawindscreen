name: Update Insurance Panel Logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-insurance-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image processing dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Update insurance panel
        run: python scripts/update-insurance-logos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html '*-clean.png'
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Update insurance panel logos"
            git push
          fi
