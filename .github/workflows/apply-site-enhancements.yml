name: Apply site enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: ${{ !contains(github.event.head_commit.message, '[site-enhancements]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject premium insurance panel, footer and enhancement scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          insurance = '''
          <section class="insurance-panels" id="insurance-panel">
            <div class="panel-header">
              <h2>INSURANCE PANEL</h2>
              <p>We Provide Hassle Free Windscreen Claim Services to the Following Insurance Companies.</p>
            </div>
            <div class="insurance-panel-grid">
              <div class="insurance-panel-card"><strong>AIA</strong></div>
              <div class="insurance-panel-card"><strong>AIG</strong></div>
              <div class="insurance-panel-card"><strong>AXA AFFIN</strong></div>
              <div class="insurance-panel-card"><strong>CHUBB</strong></div>
              <div class="insurance-panel-card"><strong>GENERALI</strong></div>
              <div class="insurance-panel-card"><strong>TAKAFUL / IKHLAS</strong></div>
              <div class="insurance-panel-card"><strong>KURNIA</strong></div>
              <div class="insurance-panel-card"><strong>LIBERTY</strong></div>
              <div class="insurance-panel-card"><strong>LONPAC</strong></div>
              <div class="insurance-panel-card"><strong>TAKAFUL MALAYSIA</strong></div>
              <div class="insurance-panel-card"><strong>MSIG</strong></div>
              <div class="insurance-panel-card"><strong>PACIFIC</strong></div>
              <div class="insurance-panel-card"><strong>P &amp; O</strong></div>
              <div class="insurance-panel-card"><strong>PROGRESIF</strong></div>
              <div class="insurance-panel-card"><strong>RHB</strong></div>
              <div class="insurance-panel-card"><strong>TOKIO MARINE</strong></div>
              <div class="insurance-panel-card"><strong>TUNE</strong></div>
              <div class="insurance-panel-card"><strong>ZURICH</strong></div>
            </div>
          </section>
          '''

          if 'class="insurance-panels"' not in s:
              marker = '<section class="atome" id="instalment">'
              if marker in s:
                  s = s.replace(marker, insurance + '\n' + marker, 1)
              else:
                  body = '</body>'
                  s = s.replace(body, insurance + '\n' + body, 1)

          # Normalize the footer to the exact requested legal/company line.
          new_footer = 'Copyright © 2026 Osaka Auto Technologies Sdn. Bhd. 201001022851 (906621-H). All Rights Reserved.'
          def normalize_footer(match):
              opening, inner, closing = match.groups()
              return opening + new_footer + closing
          s = re.sub(r'(<footer\b[^>]*>)(.*?)(</footer>)', normalize_footer, s, count=1, flags=re.I|re.S)

          # Make the existing Our Video HTML5 video start automatically.
          # Browsers generally require autoplay video to be muted; playsinline keeps
          # it inline on mobile rather than forcing fullscreen playback.
          def autoplay_video(match):
              tag = match.group(0)
              for attr in ('autoplay', 'muted', 'loop', 'playsinline'):
                  if not re.search(r'\b' + attr + r'\b', tag, flags=re.I):
                      tag = tag[:-1] + ' ' + attr + '>'
              return tag
          s = re.sub(r'<video\b[^>]*>', autoplay_video, s, flags=re.I)

          tags = [
              '<script src="site-enhancements.js?v=8"></script>',
              '<script src="contact-enhancements.js?v=2"></script>'
          ]
          for tag in tags:
              src = tag.split('"')[1]
              s = re.sub(r'<script\s+src=["\']' + re.escape(src.split('?')[0]) + r'(?:\?[^"\']*)?["\']\s*></script>\s*', '', s, flags=re.I)
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
              else:
                  s += '\n' + tag + '\n'

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "[site-enhancements] Enable automatic video playback"
            git push
          fi
