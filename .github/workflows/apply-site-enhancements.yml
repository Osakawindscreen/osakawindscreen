name: Apply site enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: ${{ !contains(github.event.head_commit.message, '[site-enhancements]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="site-enhancements.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "[site-enhancements] Enable mobile navigation, motion and insurance logos"
            git push
          fi
