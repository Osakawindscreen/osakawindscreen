name: Fix Osaka header and footer colors
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix Osaka header and footer colors')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove the previous incorrect full-hero yellow override if present.
          start=s.find('/* Osaka brand refresh */')
          if start!=-1:
              end=s.find('</style>',start)
              s=s[:start]+s[end:]
          # Keep Osaka red as the accent, but make ONLY the header and footer yellow.
          fix='''\n/* Final Osaka header/footer color adjustment */\nnav { background:#f4c400 !important; border-bottom:0 !important; }\n.nav-menu a { color:#111 !important; }\n.nav-menu a:hover { color:#c9232d !important; }\n.nav-call a { background:#f4c400 !important; color:#111 !important; border:2px solid #111 !important; }\n.hero { background:var(--bg) !important; }\n.hero:before { background:radial-gradient(circle at 50% 48%,rgba(201,35,45,.06),transparent 38%),linear-gradient(rgba(10,10,10,.84),rgba(10,10,10,.92)),url("windscreen-hero.png") !important; filter:saturate(.65) !important; }\n.hero h1 { color:var(--gold) !important; }\n.call-btn { background:#f4c400 !important; color:#111 !important; }\nfooter { background:#f4c400 !important; color:#111 !important; border-top:0 !important; }\nfooter * { color:#111 !important; }\n'''
          s=s.replace('</style>',fix+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-brand-layout.yml
          git add index.html .github/workflows/fix-brand-layout.yml
          git commit -m "Fix Osaka header and footer colors" || exit 0
          git push