name: Enlarge navigation logo

on:
  push:
    paths-ignore:
      - '.github/workflows/enlarge-hero-logo.yml'

jobs:
  enlarge-logo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enlarge header logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''.nav-logo img{\n\nheight:70px;\n\nwidth:auto;\n\ndisplay:block;\n\n}'''
          new = '''.nav-logo img{\n\nheight:92px;\n\nwidth:auto;\n\nmax-width:220px;\n\nobject-fit:contain;\n\ndisplay:block;\n\n}'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('Target logo CSS was not found; no change made.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enlarge header logo'
          git push
