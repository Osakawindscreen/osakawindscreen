name: Fix hero layout overlap v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix hero layout overlap v3') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace button-only fix with whole-content positioning fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          start = html.find('/* HERO BUTTON OVERLAP FIX */')
          end = html.find('</style>', start)
          if start == -1 or end == -1:
              raise SystemExit('Hero overlap fix block not found')
          replacement = '''/* HERO LAYOUT OVERLAP FIX V3 */
          @media (min-width:901px){
            .hero-left{
              transform:translateY(-45px) !important;
            }
          }
          @media (min-width:901px) and (max-width:1200px){
            .hero-left{
              transform:translateY(-55px) !important;
            }
          }
          @media (max-width:900px){
            .hero-left{
              transform:none !important;
            }
          }
          '''
          html = html[:start] + replacement + html[end:]
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-hero-layout-v3.yml
          git commit -m "Fix hero layout overlap v3"
          git push
