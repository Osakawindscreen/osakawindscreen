name: Osaka Design Fix

on:
  push:
    paths:
      - '.github/workflows/osaka-design-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore requested design
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Header back to yellow, while keeping the CALL US button yellow.
          s = s.replace('nav{height:78px;background:rgba(7,7,7,.96)!important;border-bottom:1px solid #252525!important}',
                        'nav{height:78px;background:#f4c400!important;border-bottom:1px solid #d5a900!important}')
          s = s.replace('.nav-menu a{color:#f5f5f5!important}', '.nav-menu a{color:#111!important}')
          s = s.replace('.nav-menu a:hover{color:#c9232d!important}', '.nav-menu a:hover{color:#c9232d!important}')
          s = s.replace('.nav-call a{background:#c9232d!important;color:#fff!important;border:1px solid #c9232d!important;box-shadow:0 8px 25px rgba(201,35,45,.22)}',
                        '.nav-call a{background:#f4c400!important;color:#111!important;border:2px solid #111!important;box-shadow:none}')

          # Hero headline: only Osaka red + white.
          s = s.replace('.automotive-hero .hero-red{color:#c9232d!important}.automotive-hero .hero-white{color:#fff!important}.automotive-hero .hero-yellow{color:#f4c400!important}',
                        '.automotive-hero .hero-red{color:#c9232d!important}.automotive-hero .hero-white{color:#fff!important}.automotive-hero .hero-yellow{color:#fff!important}')

          # Restore the previous, simpler Why Choose Us card design.
          old = '''.why-us{background:#f1f1f1!important;color:#111!important;padding:42px 30px 48px!important;text-align:left!important}.why-us-header{max-width:1180px!important;margin:0 auto 24px!important}.why-us-header h2{color:#c9232d!important;font-size:12px!important;letter-spacing:1.5px!important;margin-bottom:5px!important}.why-us-header h2:after{display:none!important}.why-us-header p{color:#111!important;font-size:30px!important;font-weight:900!important;line-height:1.05}.why-us-grid{max-width:1180px!important;grid-template-columns:1.5fr repeat(4,1fr)!important;background:#ddd!important;border:0!important;margin:auto!important}.why-us-card{background:#f7f7f7!important;color:#111!important;padding:20px 18px!important;min-height:135px}.why-us-card:first-child{display:flex;flex-direction:column;justify-content:center}.why-us-card img{width:48px!important;height:48px!important;border-radius:0!important;object-fit:cover!important;margin:0 auto 10px!important}.why-us-card h3{color:#111!important;font-size:12px!important}.why-us-whatsapp{background:#c9232d!important;border-radius:3px!important;margin:20px 0 0!important;padding:10px 20px!important;font-size:11px!important}'''
          new = '''.why-us{background:#111!important;color:#fff!important;padding:78px 30px 82px!important;text-align:center!important}.why-us-header{max-width:820px!important;margin:0 auto 42px!important}.why-us-header h2{color:#fff!important;font-size:clamp(30px,4vw,44px)!important;letter-spacing:-1px!important;margin-bottom:10px!important}.why-us-header h2:after{display:block!important;content:""!important;width:55px!important;height:3px!important;background:#c9232d!important;margin:14px auto 0!important}.why-us-header p{color:#a9a9a9!important;font-size:16px!important;font-weight:400!important;line-height:1.55!important}.why-us-grid{max-width:1180px!important;grid-template-columns:repeat(4,1fr)!important;gap:1px!important;background:#303030!important;border:1px solid #303030!important;margin:auto!important}.why-us-card{background:#171717!important;color:#fff!important;padding:30px 18px!important;min-height:210px!important;text-align:center!important}.why-us-card:first-child{display:block!important}.why-us-card img{width:170px!important;height:170px!important;border-radius:10px!important;object-fit:cover!important;margin:0 auto 18px!important}.why-us-card h3{color:#fff!important;font-size:14px!important;line-height:1.45!important}.why-us-whatsapp{background:#20c463!important;color:#fff!important;border-radius:5px!important;margin:35px 0 0!important;padding:13px 28px!important;font-size:14px!important}'''
          s = s.replace(old, new)

          # Match mobile version to the restored Why Us design.
          s = s.replace('.why-us{padding:38px 18px!important}.why-us-header p{font-size:24px!important}.why-us-grid{grid-template-columns:1fr 1fr!important}.why-us-card:first-child{grid-column:1/-1}.why-us-card{min-height:115px;padding:16px 8px!important}.why-us-card img{width:42px!important;height:42px!important}.why-us-card h3{font-size:10px!important}',
                        '.why-us{padding:65px 18px!important}.why-us-header p{font-size:16px!important}.why-us-grid{grid-template-columns:1fr 1fr!important}.why-us-card:first-child{grid-column:auto!important}.why-us-card{min-height:170px!important;padding:22px 10px!important}.why-us-card img{width:120px!important;height:120px!important}.why-us-card h3{font-size:11px!important}')

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore yellow header and original Why Us design'
          git push
