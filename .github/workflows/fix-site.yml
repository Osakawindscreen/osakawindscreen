name: Fix Osaka website sections
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-site:
    if: "!contains(github.event.head_commit.message, '[site-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Why Us and rename Customer Gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<h2>OUR WORK</h2>', '<h2>CUSTOMER GALLERY</h2>')
          marker = '</style>'
          css = r'''\n/* SECTION STABILITY FIX */\n.why-us,.gallery{position:relative;z-index:1;clear:both;overflow:visible;width:100%;box-sizing:border-box}\n.why-us{background:#090909;padding:88px 30px 95px}\n.why-us-header{width:100%;max-width:1180px;margin:0 auto 35px;text-align:left}\n.why-us-grid{width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.35fr repeat(4,minmax(0,1fr));gap:1px;background:#292929;border:1px solid #292929}\n.why-us-intro,.why-us-card{min-width:0;min-height:330px;box-sizing:border-box}\n.why-us-card{overflow:hidden}\n.why-us-card img{width:210px;height:210px;max-width:100%;object-fit:cover;display:block;margin:0 auto 22px;border-radius:6px}\n.gallery{background:#111;padding:88px 30px 95px}\n.gallery-grid{width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}\n.gallery-item{min-width:0;height:350px;overflow:hidden}\n@media(max-width:900px){.why-us,.gallery{padding-left:16px;padding-right:16px}.why-us-grid{grid-template-columns:1fr}.why-us-card img{width:min(70vw,260px);height:min(70vw,260px)}.gallery-grid{grid-template-columns:1fr 1fr}.gallery-item{height:260px}}\n@media(max-width:560px){.gallery-grid{grid-template-columns:1fr}.gallery-item{height:300px}}\n'''
          if '/* SECTION STABILITY FIX */' not in s:
              s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Repair Why Us and Customer Gallery [site-fix]"
          git push
