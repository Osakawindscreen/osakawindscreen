name: Apply Osaka brand colors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-brand-colors:
    if: "!contains(github.event.head_commit.message, 'Apply Osaka brand colors')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested design changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Osaka logo red accent.
          for old in ['#d6af2b', '#c7a21b', '#FFD700', '#ffd700', '#f4c83d']:
              html = html.replace(old, '#c9232d')

          # Add a yellow hero background with the windscreen image retained as a subtle watermark.
          hero_css = '''
          /* Osaka brand refresh */
          .hero {
            background: #f4c400 !important;
            position: relative !important;
          }
          .hero::before {
            content: "" !important;
            position: absolute !important;
            inset: 0 !important;
            background-image: linear-gradient(rgba(244,196,0,.78),rgba(244,196,0,.88)), url("windscreen-hero.png") !important;
            background-size: cover, min(780px,75vw) !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            opacity: .95 !important;
            filter: saturate(.35) contrast(.9) !important;
          }
          .hero h1 { color: #c9232d !important; }
          .hero-content { position: relative !important; z-index: 2 !important; }
          footer {
            background: #f4c400 !important;
            color: #111 !important;
            border-top: 0 !important;
          }
          footer * { color: #111 !important; }
          '''
          html = html.replace('</style>', hero_css + '\n</style>', 1)

          # Keep the WhatsApp green buttons green, as requested.
          html = html.replace('.whatsapp-btn{\n background:#c9232d;', '.whatsapp-btn{\n background:#00b140;')
          html = html.replace('.whatsapp-btn{background:#c9232d;', '.whatsapp-btn{background:#00b140;')
          html = html.replace('background:#c9232d;\n   color:white;\n   text-decoration:none;\n   font-weight:bold;\n   border-radius:8px;', 'background:#25d366;\n   color:white;\n   text-decoration:none;\n   font-weight:bold;\n   border-radius:8px;')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-brand-colors.yml
          git add index.html .github/workflows/apply-brand-colors.yml
          git commit -m "Apply Osaka brand colors" || exit 0
          git push