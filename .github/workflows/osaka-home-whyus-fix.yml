name: Osaka Home and Why Us Fix

on:
  push:
    paths:
      - '.github/workflows/osaka-home-whyus-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final design overrides
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
<style id="osaka-home-whyus-final-v2">
/* HOME: everything centered */
.hero-content{justify-content:center!important;align-items:center!important;text-align:center!important}
.hero-left{width:100%!important;max-width:1100px!important;margin:0 auto!important;text-align:center!important}
.hero h1,.hero h2{text-align:center!important;margin-left:auto!important;margin-right:auto!important}
.hero-list{justify-content:center!important;align-items:center!important;text-align:center!important}
.hero-list p{text-align:center!important}
.buttons{justify-content:center!important;align-items:center!important}

/* TOP RIGHT CALL US: white */
.nav-call a{background:#fff!important;color:#111!important;border:1px solid #fff!important}
.nav-call a:hover{background:#f2f2f2!important;color:#c9232d!important}

/* ALL WHATSAPP: green */
.whatsapp-btn,.why-us-whatsapp,.atome-btn,.floating-whatsapp,.review-button{background:#20c463!important;border-color:#20c463!important;color:#fff!important}
.whatsapp-btn:hover,.why-us-whatsapp:hover,.atome-btn:hover,.floating-whatsapp:hover,.review-button:hover{background:#19ad56!important;border-color:#19ad56!important;color:#fff!important}

/* WHY CHOOSE US: black automotive-style section */
.why-us{background:#0b0b0b!important;color:#fff!important;padding:78px 30px 88px!important;text-align:left!important}
.why-us-header{max-width:1180px!important;margin:0 auto 34px!important;text-align:left!important}
.why-us-header h2{font-size:14px!important;line-height:1.2!important;letter-spacing:2px!important;color:#c9232d!important;font-weight:900!important;margin:0 0 8px!important;text-align:left!important}
.why-us-header h2:after{display:none!important}
.why-us-header p{font-size:36px!important;line-height:1.05!important;color:#fff!important;font-weight:900!important;letter-spacing:-1px!important;margin:0!important;text-align:left!important}

/* Five-column automotive sequence: intro + four reasons */
.why-us-grid{max-width:1180px!important;margin:0 auto!important;padding:0!important;display:grid!important;grid-template-columns:1.35fr repeat(4,1fr)!important;gap:1px!important;background:#292929!important;border:1px solid #292929!important}
.why-us-grid:before{content:"Since 2001, we have been committed to providing professional, reliable and high quality auto glass services with a focus on safety and customer satisfaction.\\A\\A Cars, lorries and commercial vehicles.\\A\\A Fast service. Reliable workmanship.";white-space:pre-line!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;flex-direction:column!important;background:#111!important;color:#bcbcbc!important;padding:38px 28px!important;min-height:300px!important;font-size:13px!important;line-height:1.75!important}
.why-us-card{background:#111!important;color:#fff!important;text-align:center!important;padding:30px 14px!important;min-height:300px!important;border:0!important;border-radius:0!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important}
.why-us-card img{width:190px!important;height:190px!important;object-fit:cover!important;display:block!important;margin:0 auto 22px!important;border-radius:6px!important;box-shadow:0 12px 30px rgba(0,0,0,.45)!important}
.why-us-card h3{font-size:14px!important;line-height:1.45!important;color:#fff!important;font-weight:900!important;text-align:center!important}
.why-us-whatsapp{display:inline-block!important;margin:30px 0 0!important;padding:13px 28px!important;border-radius:5px!important;font-size:14px!important;font-weight:900!important}

@media(max-width:1000px){
 .why-us-grid{grid-template-columns:repeat(2,1fr)!important}
 .why-us-grid:before{grid-column:1/-1!important;min-height:180px!important}
 .why-us-card{min-height:260px!important}
 .why-us-card img{width:170px!important;height:170px!important}
}
@media(max-width:900px){
 .hero-content{padding:0!important}
 .hero-left{max-width:100%!important}
 .hero h1{font-size:clamp(42px,12vw,64px)!important}
 .hero h2{font-size:18px!important}
 .hero-list{display:block!important}
 .hero-list p{font-size:14px!important;margin:7px 0!important}
 .buttons{flex-direction:column!important;width:100%!important}
 .btn{width:100%!important;min-width:0!important}
 .why-us{padding:60px 18px 70px!important}
 .why-us-header{margin-bottom:24px!important}
 .why-us-header p{font-size:27px!important}
 .why-us-grid{grid-template-columns:1fr 1fr!important}
 .why-us-card{min-height:235px!important;padding:22px 8px!important}
 .why-us-card img{width:145px!important;height:145px!important;margin-bottom:14px!important}
 .why-us-card h3{font-size:11px!important}
 .nav-call{display:block!important}
 .nav-call a{padding:9px 14px!important;font-size:11px!important}
}
@media(max-width:600px){
 .nav-call{display:none!important}
 .why-us-grid{grid-template-columns:1fr!important}
 .why-us-grid:before{min-height:180px!important;padding:26px 20px!important}
 .why-us-card{min-height:220px!important}
 .why-us-card img{width:150px!important;height:150px!important}
}
</style>
'''
          marker = '<style id="osaka-home-whyus-final-v2">'
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start) + len('</style>')
              s = s[:start] + css.strip() + s[end:]
          else:
              s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit index changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Center home hero, green WhatsApp, white header call, redesign Why Us' || exit 0
          git push
