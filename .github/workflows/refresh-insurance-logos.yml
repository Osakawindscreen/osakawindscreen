name: Update insurance panel logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-insurance-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace insurance panel with logo-only design
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          css = r'''/* INSURANCE PANEL LOGOS */
          .insurance-panel-grid{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
          .insurance-panel-card{min-height:150px;background:#111;border:1px solid #292929;border-top:2px solid #c9232d;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;overflow:hidden;transition:.25s}
          .insurance-panel-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,35,45,.10),transparent 60%);pointer-events:none}
          .insurance-panel-card:hover{transform:translateY(-4px);border-color:#c9232d;box-shadow:0 14px 32px rgba(0,0,0,.4)}
          .insurance-panel-card img{position:relative;z-index:1;width:min(190px,100%);height:82px;object-fit:contain;background:#fff;border-radius:10px;padding:10px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
          .insurance-panel-card span{display:none}
          @media(max-width:1000px){.insurance-panel-grid{grid-template-columns:repeat(3,1fr)}}
          @media(max-width:700px){.insurance-panels{padding:65px 18px}.insurance-panel-grid{grid-template-columns:repeat(2,1fr);gap:10px}.insurance-panel-card{min-height:120px;padding:14px 8px}.insurance-panel-card img{width:min(150px,100%);height:66px;padding:8px}}
          @media(max-width:420px){.insurance-panel-grid{grid-template-columns:repeat(2,1fr)}.insurance-panel-card{min-height:105px}.insurance-panel-card img{height:58px;padding:7px}}
          </style>'''

          s = re.sub(r'/\* INSURANCE PANEL LOGOS \*/.*?</style>', css, s, count=1, flags=re.S)

          block = '''<section class="insurance-panels" id="insurance-panels">
            <div class="panel-header">
              <h2>OUR INSURANCE PANELS</h2>
              <p>Recognised insurance &amp; takaful panels for windscreen claim assistance.</p>
            </div>
            <div class="insurance-panel-grid">
              <div class="insurance-panel-card" title="AIA"><img src="https://cdn.simpleicons.org/aia" alt="AIA logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="AXA AFFIN"><img src="https://cdn.simpleicons.org/axa" alt="AXA AFFIN logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="CHUBB"><img src="https://cdn.simpleicons.org/chubb" alt="CHUBB logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="LIBERTY"><img src="https://logo.clearbit.com/libertyinsurance.com.my" alt="Liberty Insurance logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="LONPAC"><img src="https://logo.clearbit.com/lonpac.com" alt="Lonpac logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="MSIG"><img src="https://cdn.simpleicons.org/msig" alt="MSIG logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="P &amp; O"><img src="https://logo.clearbit.com/pacific-orient.com" alt="Pacific &amp; Orient logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="PROGRESIF"><img src="https://logo.clearbit.com/progresif.com" alt="Progresif logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="GENERALI"><img src="https://cdn.simpleicons.org/generali" alt="Generali logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="RHB"><img src="https://logo.clearbit.com/rhbinsurance.com.my" alt="RHB Insurance logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="TAKAFUL IKHLAS"><img src="https://logo.clearbit.com/takaful-ikhlas.com.my" alt="Takaful Ikhlas logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="THE PACIFIC"><img src="https://logo.clearbit.com/pacificinsurance.com.my" alt="The Pacific Insurance logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="TOKIO MARINE"><img src="https://cdn.simpleicons.org/tokiomarine" alt="Tokio Marine logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="ZURICH"><img src="https://cdn.simpleicons.org/zurich" alt="Zurich logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="KURNIA"><img src="https://logo.clearbit.com/kurnia.com" alt="Kurnia logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="AIG"><img src="https://cdn.simpleicons.org/aig" alt="AIG logo" loading="lazy"></div>
              <div class="insurance-panel-card" title="TAKAFUL MALAYSIA"><img src="https://logo.clearbit.com/takaful-malaysia.com.my" alt="Takaful Malaysia logo" loading="lazy"></div>
            </div>
            <p class="insurance-panel-note"><b>Need to claim?</b> Send us your insurance details on WhatsApp and we will help you check the latest claim procedure and required documents.</p>
          </section>'''

          s = re.sub(r'<section class="insurance-panels" id="insurance-panels">.*?</section>', block, s, count=1, flags=re.S)
          p.write_text(s, encoding="utf-8")

      - name: Commit changes and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refresh-insurance-logos.yml
          git commit -m "Use insurance company logos instead of text"
          git rm .github/workflows/refresh-insurance-logos.yml
          git commit -m "Remove one-time insurance logo updater"
          git push