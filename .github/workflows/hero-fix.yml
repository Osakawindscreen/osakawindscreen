name: Apply Osaka hero layout fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[hero-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hero CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css=r'''
          /* HERO REFERENCE FIX — match supplied reference scale and spacing */
          @media (min-width: 1201px){
            .hero{height:690px}
            .hero-content{grid-template-columns:minmax(0,1fr) 330px;align-items:flex-start}
            .hero-left{margin-left:5vw;margin-top:78px;max-width:820px}
            .hero-trust-card{width:330px;min-height:160px;margin-right:0;margin-top:205px;padding:22px 35px 22px 58px;display:flex;flex-direction:column;justify-content:center;align-items:center}
            .hero-trust-card strong{font-size:42px;line-height:1.02}
            .hero-trust-card span{font-size:15px}
            .hero-service-strip{bottom:0;left:2.65%;width:94.7%;height:103px}
            .buttons{margin-top:26px}
          }
          @media (min-width:901px) and (max-width:1200px){
            .hero{height:640px}
            .hero-content{grid-template-columns:minmax(0,1fr) 290px;align-items:flex-start}
            .hero-left{margin-left:4vw;margin-top:65px}
            .hero-trust-card{width:290px;min-height:145px;margin-top:180px;padding:20px 28px 20px 48px}
            .hero-trust-card strong{font-size:36px}
            .hero-service-strip{bottom:0;left:2%;width:96%;height:98px}
          }
          @media (max-width:900px){
            .hero{min-height:900px}
            .hero-content{padding:30px 22px 190px;gap:12px}
            .hero-left{margin:0}
            .hero-trust-card{width:270px;min-height:132px;margin:10px -22px 0 auto;padding:20px 42px 20px 58px}
            .hero-service-strip{position:absolute;bottom:0;left:0;width:100%;height:auto}
            .buttons{position:relative;z-index:6;margin-top:20px}
            .hero-service-strip{z-index:3}
          }
          @media (max-width:560px){
            .hero{min-height:930px}
            .hero-content{padding:28px 16px 210px}
            .hero-trust-card{width:245px;min-height:120px;margin-right:-16px;padding:18px 30px 18px 48px}
            .hero-service-strip{grid-template-columns:1fr 1fr}
          }
          '''
          marker='</style>'
          if 'HERO REFERENCE FIX — match supplied reference scale and spacing' not in s:
              s=s.replace(marker, css+'\n'+marker, 1)
              p.write_text(s)
          PY
      - name: Commit patched hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hero-fix.yml
          git add index.html
          git diff --cached --quiet || git commit -m "Fix hero badge and service strip spacing [hero-fix-applied]"
          git push
