name: Automotive premium homepage redesign
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  redesign:
    if: "!contains(github.event.head_commit.message, 'Automotive premium homepage redesign')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          hero = '''<section class="hero automotive-hero" id="home">
            <div class="hero-content automotive-hero-content">
              <div class="hero-left automotive-hero-left">
                <div class="hero-kicker" data-en="OSAKA WINDSCREEN • KLANG" data-ms="OSAKA WINDSCREEN • KLANG">OSAKA WINDSCREEN • KLANG</div>
                <h1 class="hero-headline">
                  <span class="hero-red">WINDSCREEN</span><br>
                  <span class="hero-white">SPECIALIST</span><br>
                  <span class="hero-yellow">NO.1 IN KLANG</span>
                </h1>
                <h2 data-en="Professional Auto Glass Specialist Since 2001" data-ms="Pakar Cermin Kereta Profesional Sejak 2001">Professional Auto Glass Specialist Since 2001</h2>
                <div class="hero-list automotive-hero-list">
                  <p data-en="✓ 25 Years Experience" data-ms="✓ 25 Tahun Pengalaman">✓ 25 Years Experience</p>
                  <p data-en="✓ Cars, Lorries &amp; Commercial Vehicles" data-ms="✓ Kereta, Lori &amp; Kenderaan Komersial">✓ Cars, Lorries &amp; Commercial Vehicles</p>
                  <p data-en="✓ Insurance Claim Assistance" data-ms="✓ Bantuan Tuntutan Insurans">✓ Insurance Claim Assistance</p>
                  <p data-en="✓ Same Day Service" data-ms="✓ Servis Hari Yang Sama">✓ Same Day Service</p>
                </div>
                <div class="buttons automotive-buttons">
                  <a class="btn whatsapp-btn" href="https://wa.me/60103209929" target="_blank" data-en="WHATSAPP US" data-ms="WHATSAPP KAMI">WHATSAPP US</a>
                  <a class="btn call-btn" href="tel:0103209929" data-en="CALL NOW" data-ms="HUBUNGI SEKARANG">CALL NOW</a>
                </div>
              </div>
              <div class="hero-trust-card">
                <div class="trust-line" data-en="TRUSTED BY" data-ms="DIPERCAYAI OLEH">TRUSTED BY</div>
                <strong>10,000+</strong>
                <span data-en="CUSTOMERS" data-ms="PELANGGAN">CUSTOMERS</span>
              </div>
            </div>
          </section>
          <section class="hero-service-strip" aria-label="Osaka quick services">
            <div class="hero-service-item"><b>01</b><span data-en="CAR WINDSCREEN" data-ms="WINDSCREEN KERETA">CAR WINDSCREEN</span><small data-en="Replacement &amp; Repair" data-ms="Penggantian &amp; Baiki">Replacement &amp; Repair</small></div>
            <div class="hero-service-item"><b>02</b><span data-en="LORRY &amp; TRUCK" data-ms="LORI &amp; TRUCK">LORRY &amp; TRUCK</span><small data-en="Commercial Vehicles" data-ms="Kenderaan Komersial">Commercial Vehicles</small></div>
            <div class="hero-service-item"><b>03</b><span data-en="WINDSCREEN REPAIR" data-ms="BAIKI WINDSCREEN">WINDSCREEN REPAIR</span><small data-en="Chip &amp; Crack Repair" data-ms="Baiki Batu &amp; Retak">Chip &amp; Crack Repair</small></div>
            <div class="hero-service-item"><b>04</b><span data-en="WINDSCREEN TINTING" data-ms="TINT WINDSCREEN">WINDSCREEN TINTING</span><small data-en="Protection &amp; Comfort" data-ms="Perlindungan &amp; Keselesaan">Protection &amp; Comfort</small></div>
            <div class="hero-service-item"><b>05</b><span data-en="INSURANCE CLAIM" data-ms="TUNTUTAN INSURANS">INSURANCE CLAIM</span><small data-en="We Handle The Process" data-ms="Kami Uruskan Proses">We Handle The Process</small></div>
            <div class="hero-service-item"><b>06</b><span data-en="GLASS &amp; PARTS" data-ms="KACA &amp; ALAT GANTI">GLASS &amp; PARTS</span><small data-en="Original &amp; Quality Options" data-ms="Pilihan Berkualiti">Original &amp; Quality Options</small></div>
          </section>'''

          s, n = re.subn(r'<section class="hero" id="home">.*?</section>', hero, s, count=1, flags=re.S)
          if not n:
              raise SystemExit('Hero section not found')

          # Move the Why Us block directly after the new hero/service strip, matching the requested automotive landing-page hierarchy.
          m = re.search(r'<section class="why-us" id="why-us">.*?</section>', s, flags=re.S)
          if m:
              why = m.group(0)
              s = s[:m.start()] + s[m.end():]
              marker = '</section>\n<section class="video-section" id="our-video">'
              s = s.replace(marker, '</section>\n' + why + '\n<section class="video-section" id="our-video">', 1)

          css = r'''
          /* === AUTOMOTIVE PREMIUM HOMEPAGE === */
          nav{height:78px;background:rgba(7,7,7,.96)!important;border-bottom:1px solid #252525!important}
          .nav-logo img{height:68px!important;width:auto!important;object-fit:contain}
          .nav-menu a{color:#f5f5f5!important}
          .nav-menu a:hover{color:#c9232d!important}
          .nav-call a{background:#c9232d!important;color:#fff!important;border:1px solid #c9232d!important;box-shadow:0 8px 25px rgba(201,35,45,.22)}
          .automotive-hero{min-height:calc(100vh - 78px)!important;margin-top:78px!important;padding:55px 36px 45px!important;align-items:center!important;background:#050505!important}
          .automotive-hero:before{background:linear-gradient(90deg,rgba(0,0,0,.93) 0%,rgba(0,0,0,.78) 39%,rgba(0,0,0,.30) 70%,rgba(0,0,0,.48) 100%),linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.28)),url("windscreen-hero.png")!important;background-size:cover,cover,cover!important;background-position:center!important;opacity:1!important;filter:saturate(.9) contrast(1.05)!important}
          .automotive-hero:after{background:linear-gradient(90deg,rgba(201,35,45,.10),transparent 40%,rgba(0,0,0,.18))!important}
          .automotive-hero-content{max-width:1180px!important;justify-content:space-between!important;text-align:left!important;min-height:570px}
          .automotive-hero-left{max-width:700px!important;padding-top:10px}
          .hero-kicker{display:inline-block;color:#f4c400;border-left:3px solid #c9232d;padding:4px 0 4px 12px;font-size:12px;font-weight:900;letter-spacing:2.2px;margin-bottom:18px}
          .automotive-hero .hero-headline{font-size:clamp(52px,6.3vw,88px)!important;line-height:.88!important;letter-spacing:-3.5px!important;margin-bottom:24px!important;text-shadow:0 4px 25px rgba(0,0,0,.75)!important}
          .automotive-hero .hero-red{color:#c9232d!important}.automotive-hero .hero-white{color:#fff!important}.automotive-hero .hero-yellow{color:#f4c400!important}
          .automotive-hero h2{font-size:clamp(18px,2vw,24px)!important;margin-bottom:18px!important;color:#fff!important}
          .automotive-hero-list{justify-content:flex-start!important;gap:6px 25px!important;max-width:720px}
          .automotive-hero-list p{font-size:13px!important;color:#e8e8e8!important;font-weight:700!important}
          .automotive-buttons{justify-content:flex-start!important;margin-top:27px!important;gap:12px!important}
          .automotive-buttons .btn{min-width:155px!important;padding:13px 22px!important;font-size:14px!important;border-radius:3px!important;text-align:center}
          .automotive-buttons .whatsapp-btn{background:#c9232d!important}.automotive-buttons .call-btn{background:transparent!important;color:#fff!important;border:1px solid #f4c400!important}
          .hero-trust-card{margin-right:5px;margin-top:120px;min-width:205px;padding:18px 22px 20px;background:rgba(201,35,45,.96);clip-path:polygon(10% 0,100% 0,100% 100%,10% 100%,0 50%);text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.45)}
          .hero-trust-card .trust-line{font-size:11px;letter-spacing:1.5px;font-weight:900;color:#f4c400}.hero-trust-card strong{display:block;font-size:39px;line-height:1.05;color:#fff}.hero-trust-card span{font-size:14px;font-weight:900;color:#fff;letter-spacing:1px}
          .hero-service-strip{max-width:1200px;margin:-1px auto 0;background:#070707;border:1px solid #292929;display:grid;grid-template-columns:repeat(6,1fr);position:relative;z-index:4}
          .hero-service-item{min-height:82px;padding:15px 15px 13px;border-right:1px solid #292929;position:relative}.hero-service-item:last-child{border-right:0}.hero-service-item b{display:block;color:#c9232d;font-size:10px;letter-spacing:1.5px;margin-bottom:7px}.hero-service-item span{display:block;color:#fff;font-size:11px;font-weight:900;white-space:nowrap}.hero-service-item small{display:block;color:#888;font-size:9px;margin-top:4px;line-height:1.3}.hero-service-item:after{content:"";position:absolute;left:0;bottom:0;width:36px;height:2px;background:#c9232d}
          .why-us{background:#f1f1f1!important;color:#111!important;padding:42px 30px 48px!important;text-align:left!important}.why-us-header{max-width:1180px!important;margin:0 auto 24px!important}.why-us-header h2{color:#c9232d!important;font-size:12px!important;letter-spacing:1.5px!important;margin-bottom:5px!important}.why-us-header h2:after{display:none!important}.why-us-header p{color:#111!important;font-size:30px!important;font-weight:900!important;line-height:1.05}.why-us-grid{max-width:1180px!important;grid-template-columns:1.5fr repeat(4,1fr)!important;background:#ddd!important;border:0!important;margin:auto!important}.why-us-card{background:#f7f7f7!important;color:#111!important;padding:20px 18px!important;min-height:135px}.why-us-card:first-child{display:flex;flex-direction:column;justify-content:center}.why-us-card img{width:48px!important;height:48px!important;border-radius:0!important;object-fit:cover!important;margin:0 auto 10px!important}.why-us-card h3{color:#111!important;font-size:12px!important}.why-us-whatsapp{background:#c9232d!important;border-radius:3px!important;margin:20px 0 0!important;padding:10px 20px!important;font-size:11px!important}
          footer{background:#f4c400!important;color:#111!important}footer *{color:#111!important}
          @media(max-width:900px){
            nav{height:64px!important;padding:3px 10px!important}.nav-logo img{height:54px!important}.nav-menu{gap:15px!important}.nav-menu a{font-size:9px!important}
            .automotive-hero{margin-top:64px!important;min-height:calc(100svh - 64px)!important;padding:45px 18px 35px!important}.automotive-hero:before{background:linear-gradient(rgba(0,0,0,.76),rgba(0,0,0,.88)),url("windscreen-hero.png")!important;background-size:cover,cover!important;background-position:center!important}.automotive-hero-content{display:block!important;min-height:auto!important}.automotive-hero-left{max-width:100%!important}.hero-kicker{font-size:10px!important}.automotive-hero .hero-headline{font-size:clamp(43px,13vw,68px)!important;letter-spacing:-2.5px!important}.automotive-hero h2{font-size:16px!important}.automotive-hero-list{display:grid!important;grid-template-columns:1fr 1fr;gap:7px 14px!important}.automotive-hero-list p{font-size:11px!important}.automotive-buttons{flex-direction:row!important;width:auto!important}.automotive-buttons .btn{width:auto!important;min-width:145px!important}.hero-trust-card{display:none}.hero-service-strip{grid-template-columns:repeat(2,1fr);margin:0 12px}.hero-service-item{min-height:70px;padding:12px}.hero-service-item span{font-size:10px}.hero-service-item small{font-size:8px}.why-us{padding:38px 18px!important}.why-us-header p{font-size:24px!important}.why-us-grid{grid-template-columns:1fr 1fr!important}.why-us-card:first-child{grid-column:1/-1}.why-us-card{min-height:115px;padding:16px 8px!important}.why-us-card img{width:42px!important;height:42px!important}.why-us-card h3{font-size:10px!important}
          }
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/automotive-home-redesign.yml
          git add index.html .github/workflows/automotive-home-redesign.yml
          git commit -m "Automotive premium homepage redesign"
          git push